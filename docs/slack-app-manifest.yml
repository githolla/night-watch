display_information:
  name: Night Watch
  description: Source-backed outbound intelligence and morning desk controls
  background_color: "#28241f"
features:
  bot_user:
    display_name: Night Watch
    always_online: true
  slash_commands:
    - command: /night-watch
      url: https://YOUR-NIGHT-WATCH-DOMAIN/api/slack/commands
      description: Open today's Night Watch morning desk
      usage_hint: brief | help
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
settings:
  interactivity:
    is_enabled: true
    request_url: https://YOUR-NIGHT-WATCH-DOMAIN/api/slack/actions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
